; ESP32-C3 Super Mini 灰尘浓度自动调速风扇
; PlatformIO Project Configuration File
;
; 本机 C: 盘空间不足，构建产物与库目录需指向 D: 盘（用环境变量，不写死路径）：
;   $env:PLATFORMIO_CORE_DIR   = "D:\pio_core"
;   $env:PLATFORMIO_BUILD_DIR  = "D:\pio_build\esp32_pm2.5\build"
;   $env:PLATFORMIO_LIBDEPS_DIR= "D:\pio_build\esp32_pm2.5\libdeps"
;   pio run -t upload

[env:esp32c3-supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino

; GPIO20/21 被风扇占用（默认 UART0），调试串口改走 USB CDC
build_flags =
    -DCORE_DEBUG_LEVEL=3              ; Arduino 框架：显示 INFO 及以上
    -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE ; 允许文件级覆盖为 VERBOSE
    -DCONFIG_LOG_COLORS=1             ; 彩色日志输出（终端支持）
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; board_build.flash_mode = dio


; ========== 串口监视器配置 ==========
upload_port = COM4
monitor_port = COM4
board_upload.speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; LovyanGFX 1.2.21：GitHub 拉取不稳定，使用本地副本（同 esp32_screen_st7735 项目版本）
lib_deps =
    ; file://D:/pio_libs/LovyanGFX
    lovyan03/LovyanGFX
    ; adafruit/DHT sensor library@~1.4.6
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor@~1.1.13
